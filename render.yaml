databases:
  - name: cloudbudget-db
    databaseName: cloudbudget
    user: cloudbudget
    plan: free

services:
  - type: web
    name: cloudbudget-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: cloudbudget-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

